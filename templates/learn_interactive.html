<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject.title() }} - EduGalaxy Adventure</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --char-color: #f97316;
            --bg: #0e0a1e;
            --surface: rgba(255,255,255,0.06);
            --border: rgba(255,255,255,0.15);
            --glow: rgba(249,115,22,0.4);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* PARTICLE CANVAS */
        #particles { position: fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

        .page-wrap { position: relative; z-index:1; max-width: 1280px; margin: 0 auto; padding: 1rem 1.5rem; }

        /* ═══════ TOP BAR ═══════ */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.8rem 1.5rem; margin-bottom: 1.5rem;
            background: var(--surface); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 20px;
        }
        .top-bar h1 { font-family: 'Bangers', cursive; font-size: 1.8rem; letter-spacing: 2px; color: var(--char-color); text-shadow: 0 0 20px var(--glow); }
        .xp-badge { background: linear-gradient(135deg,#f59e0b,#ef4444); padding: 0.5rem 1.2rem; border-radius: 50px; font-weight: 900; font-size: 1.1rem; }
        .back-btn { background: none; border: 2px solid var(--border); color: #fff; padding: 0.5rem 1rem; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .back-btn:hover { background: var(--char-color); border-color: var(--char-color); }

        /* ═══════ CHARACTER STAGE ═══════ */
        .character-stage {
            display: flex; align-items: flex-end; justify-content: center;
            gap: 1rem; padding: 1rem; margin-bottom: 1.5rem; min-height: 320px;
            position: relative;
        }
        .char-card {
            position: relative; cursor: pointer; transition: transform 0.3s;
        }
        .char-card:hover { transform: scale(1.05); }
        .char-sprite {
            width: 200px; height: 280px;
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
            filter: drop-shadow(0 0 20px var(--char-color));
            animation: float 3s ease-in-out infinite;
        }
        .char-sprite.talking { animation: talk 0.15s ease alternate infinite, float 3s ease-in-out infinite; }
        .char-sprite.active-char { filter: drop-shadow(0 0 40px var(--char-color)) brightness(1.2); }
        .char-name-badge {
            position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            background: var(--char-color); color: #fff; font-weight: 900; font-size: 0.85rem;
            padding: 4px 14px; border-radius: 20px; white-space: nowrap;
            box-shadow: 0 4px 15px var(--glow);
        }
        .speech-bubble {
            position: absolute; top: -110px; left: 50%; transform: translateX(-50%);
            background: #fff; color: #1e1b4b; padding: 0.8rem 1.2rem;
            border-radius: 18px; font-weight: 700; font-size: 0.85rem;
            max-width: 220px; text-align: center; opacity: 0;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            transition: opacity 0.4s;
            pointer-events: none;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%);
            border: 10px solid transparent; border-top-color: #fff; border-bottom: none;
        }
        .speech-bubble.visible { opacity: 1; }

        /* ═══════ MODE TABS ═══════ */
        .mode-tabs {
            display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.5rem;
            margin-bottom: 1.5rem; scrollbar-width: none;
        }
        .mode-tab {
            flex-shrink: 0; padding: 0.7rem 1.4rem; border-radius: 50px;
            background: var(--surface); border: 1px solid var(--border);
            color: #ccc; font-weight: 700; cursor: pointer; transition: all 0.3s;
            font-family: 'Nunito', sans-serif; font-size: 0.9rem;
        }
        .mode-tab:hover { color: #fff; border-color: var(--char-color); }
        .mode-tab.active {
            background: var(--char-color); border-color: var(--char-color);
            color: #fff; box-shadow: 0 4px 20px var(--glow);
        }

        /* ═══════ CONTENT ARENA ═══════ */
        .content-arena {
            background: var(--surface); backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 28px;
            min-height: 460px; padding: 2rem; position: relative; overflow: hidden;
        }
        .content-arena::before {
            content: ''; position: absolute; top: -50%; right: -20%;
            width: 500px; height: 500px; border-radius: 50%;
            background: radial-gradient(circle, var(--glow), transparent 70%);
            pointer-events: none;
        }
        /* ═══════ STORY CARD ═══════ */
        .story-card {
            display: flex; gap: 2rem; align-items: flex-start;
        }
        .story-text-body {
            flex: 1; font-size: 1.3rem; line-height: 1.8;
            background: rgba(255,255,255,0.05); padding: 2rem; border-radius: 20px;
            border-left: 5px solid var(--char-color);
        }
        .catchphrase {
            margin-top: 1.5rem; font-size: 1.1rem; font-style: italic;
            color: var(--char-color); font-weight: 700;
        }
        .voice-btn {
            display: inline-flex; align-items: center; gap: 0.6rem;
            margin-top: 1.2rem; padding: 0.8rem 2rem; border-radius: 50px;
            background: var(--char-color); color: #fff; font-weight: 900;
            font-size: 1rem; border: none; cursor: pointer;
            box-shadow: 0 4px 20px var(--glow); transition: 0.2s; font-family: 'Nunito', sans-serif;
        }
        .voice-btn:hover { transform: scale(1.05); }
        .voice-btn.speaking { animation: pulse-glow 0.6s ease infinite alternate; }

        /* ═══════ ADVENTURE GAME ═══════ */
        #gameCanvas {
            width: 100%; max-width: 800px; border-radius: 18px;
            border: 3px solid var(--char-color);
            box-shadow: 0 0 40px var(--glow); display: block; margin: 0 auto;
        }
        .game-hud {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem; padding: 0.8rem 1.5rem;
            background: rgba(0,0,0,0.4); border-radius: 14px;
        }

        /* ═══════ PUZZLE ═══════ */
        .puzzle-items-row { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 2rem; }
        .drag-chip {
            padding: 0.8rem 1.6rem; border-radius: 50px; font-weight: 900;
            font-size: 1.1rem; background: linear-gradient(135deg, var(--char-color), #a855f7);
            cursor: grab; user-select: none; border: none; color: #fff;
            box-shadow: 0 4px 15px var(--glow); transition: transform 0.2s;
        }
        .drag-chip:active { cursor: grabbing; transform: scale(1.1); }
        .drop-zone {
            min-width: 280px; min-height: 120px;
            border: 3px dashed var(--char-color); border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: #aaa; transition: all 0.3s; margin: 0 auto;
        }
        .drop-zone.drag-over { background: rgba(249,115,22,0.15); color: #fff; transform: scale(1.02); }
        .drop-zone.success { background: rgba(74,222,128,0.2); border-color: #4ade80; color: #4ade80; }

        /* ═══════ EXPERIMENT ═══════ */
        .lab-grid { display: grid; grid-template-columns: 1fr 280px; gap: 1.5rem; align-items: start; }
        #experimentCanvas { width: 100%; border-radius: 16px; background: radial-gradient(circle at center, #1e3a5f, #0a0a1a); }
        .lab-panel { background: rgba(0,0,0,0.3); border-radius: 20px; padding: 1.5rem; }
        .run-btn {
            width: 100%; padding: 1rem; border-radius: 14px; border: none;
            background: var(--char-color); color: #fff; font-weight: 900; font-size: 1rem;
            cursor: pointer; margin-top: 1.2rem; font-family: 'Nunito', sans-serif;
            box-shadow: 0 4px 20px var(--glow); transition: 0.2s;
        }
        .run-btn:hover { transform: translateY(-2px); }

        /* ═══════ VOICE ═══════ */
        .voice-stage { text-align: center; padding: 2rem; }
        .mic-orb {
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, var(--char-color), #7c3aed);
            display: flex; align-items: center; justify-content: center;
            margin: 2rem auto; cursor: pointer; font-size: 3rem;
            box-shadow: 0 0 60px var(--glow); transition: all 0.3s;
        }
        .mic-orb:hover { transform: scale(1.1); box-shadow: 0 0 80px var(--glow); }
        .mic-orb.listening { animation: mic-pulse 1s ease infinite; }
        .sentence-box {
            font-size: 1.8rem; font-weight: 900; padding: 1.5rem 2rem;
            border-radius: 20px; background: rgba(255,255,255,0.08);
            border-left: 6px solid var(--char-color); max-width: 700px; margin: 0 auto;
        }
        .feedback-msg { font-size: 1.2rem; font-weight: 700; margin-top: 1.5rem; }
        .feedback-msg.correct { color: #4ade80; }
        .feedback-msg.wrong { color: #f87171; }

        /* ═══════ TOPIC STRIP ═══════ */
        .topic-strip {
            display: flex; gap: 0.6rem; overflow-x: auto; padding: 0.8rem 0;
            margin-top: 1.5rem; scrollbar-width: none;
        }
        .topic-chip {
            flex-shrink: 0; padding: 0.5rem 1.2rem; border-radius: 50px;
            background: var(--surface); border: 1px solid var(--border);
            color: #ccc; font-weight: 700; cursor: pointer; transition: 0.2s;
            font-family: 'Nunito', sans-serif; font-size: 0.85rem;
        }
        .topic-chip:hover, .topic-chip.active { background: var(--char-color); color: #fff; border-color: var(--char-color); }

        /* ═══════ ANIMATIONS ═══════ */
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-18px); }
        }
        @keyframes talk {
            from { transform: scaleY(1) translateY(0); }
            to   { transform: scaleY(1.04) translateY(-2px); }
        }
        @keyframes pulse-glow {
            from { box-shadow: 0 4px 20px var(--glow); }
            to   { box-shadow: 0 4px 50px var(--char-color); }
        }
        @keyframes mic-pulse {
            0%,100% { box-shadow: 0 0 60px var(--glow); }
            50% { box-shadow: 0 0 100px var(--char-color), 0 0 160px var(--glow); }
        }
        @keyframes slide-in {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .slide-in { animation: slide-in 0.5s ease forwards; }

        /* ═══════ XP POPUP ═══════ */
        .xp-popup {
            position: fixed; top: 20%; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff; font-family: 'Bangers', cursive; font-size: 3rem;
            padding: 1rem 3rem; border-radius: 20px; z-index: 9999;
            box-shadow: 0 0 60px rgba(245,158,11,0.6); display: none;
        }

        /* Loading spinner */
        .loader { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 400px; gap: 1rem; }
        .loader i { font-size: 3rem; color: var(--char-color); }
        .glass-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
    </style>
</head>
<body>
<canvas id="particles"></canvas>

<div class="page-wrap">
    <!-- TOP BAR -->
    <div class="top-bar">
        <button class="back-btn" onclick="window.location.href='{{ url_for('learn') }}'">
            <i class="fas fa-arrow-left"></i> Back
        </button>
        <div style="display:flex;flex-direction:column;align-items:center;gap:0.2rem">
            <h1 id="page-title" style="font-family:'Bangers',cursive;font-size:1.6rem;letter-spacing:2px;color:var(--char-color);text-shadow:0 0 20px var(--glow)">⚡ {{ subject.title() }} Adventure</h1>
            <div id="session-xp-bar" style="display:flex;align-items:center;gap:0.6rem;font-size:0.78rem;opacity:0.7">
                <span>Session XP:</span>
                <span id="session-xp-val" style="color:#fbbf24;font-weight:900">+0</span>
                <div style="width:100px;height:5px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden">
                    <div id="session-xp-fill" style="height:100%;width:0%;background:linear-gradient(90deg,#f97316,#fbbf24);border-radius:3px;transition:width 0.6s ease"></div>
                </div>
            </div>
        </div>
        <div style="display:flex;align-items:center;gap:0.6rem">
            <button class="back-btn" id="hint-btn" onclick="fetchHint()" title="Get a hint!">
                💡 Hint
            </button>
            <div class="xp-badge"><i class="fas fa-star"></i> <span id="xp-display">{{ user.xp }}</span> XP</div>
        </div>
    </div>


    <!-- CHARACTER STAGE -->
    <div class="character-stage" id="char-stage">
        <!-- Characters injected here by JS -->
        <div class="loader"><i class="fas fa-spinner fa-spin"></i><p>Summoning Heroes...</p></div>
    </div>

    <!-- MODE TABS -->
    <div class="mode-tabs">
        <div class="mode-tab active" onclick="switchMode('storybook')" id="tab-storybook">📖 Storybook</div>
        <div class="mode-tab" onclick="switchMode('adventure')" id="tab-adventure">🎮 Adventure</div>
        <div class="mode-tab" onclick="switchMode('puzzle')" id="tab-puzzle">🧩 Puzzle</div>
        <div class="mode-tab" onclick="switchMode('experiment')" id="tab-experiment">🔬 Lab</div>
        <div class="mode-tab" onclick="switchMode('voice')" id="tab-voice">🎤 Voice</div>
        <div class="mode-tab" onclick="switchMode('3d-world')" id="tab-3d-world">🌍 3D World</div>
    </div>

    <!-- CONTENT ARENA -->
    <div class="content-arena" id="content-arena">
        <div class="loader"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>
    </div>

    <!-- TOPIC STRIP -->
    <div class="topic-strip" id="topic-strip">
        {% for t in topics %}
        <div class="topic-chip" onclick="loadTopic('{{ t }}')" data-topic="{{ t }}">{{ t }}</div>
        {% endfor %}
    </div>
</div>

<!-- XP POPUP -->
<div class="xp-popup" id="xp-popup">🌟 +<span id="xp-amount">50</span> XP!</div>

<!-- ADVENTURE CANVAS (kept hidden, moved in) -->
<canvas id="gameCanvas" width="800" height="420" style="display:none;"></canvas>

<script>
// ═══════════════════════════════════════════
//  CHARACTER DATA (Voice Profiles)
// ═══════════════════════════════════════════
const CHAR_VOICES = {
    naruto:  { pitch: 1.4, rate: 1.1, voice_name: 'en-US' },
    luffy:   { pitch: 1.3, rate: 1.2, voice_name: 'en-US' },
    goku:    { pitch: 0.9, rate: 0.95, voice_name: 'en-US' },
    deku:    { pitch: 1.2, rate: 1.0, voice_name: 'en-US' },
    tanjiro: { pitch: 1.0, rate: 0.95, voice_name: 'en-US' },
    ichigo:  { pitch: 0.85, rate: 0.9, voice_name: 'en-US' },
    sakura:  { pitch: 1.5, rate: 1.1, voice_name: 'en-US' },
    nami:    { pitch: 1.6, rate: 1.15, voice_name: 'en-US' },
    nezuko:  { pitch: 1.7, rate: 0.9, voice_name: 'en-US' },
    anya:    { pitch: 1.7, rate: 1.2, voice_name: 'en-US' },
    boruto:  { pitch: 1.35, rate: 1.1, voice_name: 'en-US' },
    hinata:  { pitch: 1.55, rate: 0.9, voice_name: 'en-US' },
    bulma:   { pitch: 1.5, rate: 1.05, voice_name: 'en-US' },
    chopper: { pitch: 1.65, rate: 1.15, voice_name: 'en-US' },
};

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let currentMode = 'storybook';
let currentTopic = '{{ topics[0] }}';
let lessonData = null;
let activeCharKey = null;
let gameActive = false, gameLoop = null, score = 0;
const TARGET_SCORE = 5;
let player = { x: 60, y: 320, w: 48, h: 48, speed: 6 };
let gameItems = [];
let keys = {};

// ═══════════════════════════════════════════
//  PARTICLE BACKGROUND
// ═══════════════════════════════════════════
(function initParticles() {
    const c = document.getElementById('particles');
    const ctx = c.getContext('2d');
    let W = c.width = window.innerWidth;
    let H = c.height = window.innerHeight;
    const dots = Array.from({length: 80}, () => ({
        x: Math.random()*W, y: Math.random()*H,
        r: Math.random()*1.8+0.4, vx: (Math.random()-0.5)*0.3,
        vy: (Math.random()-0.5)*0.3, a: Math.random()
    }));
    function draw() {
        ctx.clearRect(0,0,W,H);
        dots.forEach(d => {
            d.x+=d.vx; d.y+=d.vy;
            if(d.x<0)d.x=W; if(d.x>W)d.x=0;
            if(d.y<0)d.y=H; if(d.y>H)d.y=0;
            ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
            ctx.fillStyle = `rgba(249,115,22,${d.a*0.5})`;
            ctx.fill();
        });
        requestAnimationFrame(draw);
    }
    draw();
    window.addEventListener('resize', () => { W=c.width=window.innerWidth; H=c.height=window.innerHeight; });
})();

// ═══════════════════════════════════════════
//  SPEAK — Character Voice
// ═══════════════════════════════════════════
function speakAs(text, charKey, onDone) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const v = CHAR_VOICES[charKey] || { pitch: 1.1, rate: 1.0 };
    const utt = new SpeechSynthesisUtterance(text);
    utt.pitch = v.pitch;
    utt.rate = v.rate;
    utt.lang = v.voice_name || 'en-US';

    // Pick a female voice if char is female
    const femaleChars = ['sakura','nami','nezuko','anya','hinata','bulma'];
    const isFemale = femaleChars.includes(charKey);
    const voices = window.speechSynthesis.getVoices();
    const match = voices.find(v => isFemale ? v.name.includes('Female') || v.name.includes('Samantha') || v.name.includes('Google UK English Female') : v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('Google US English'));
    if (match) utt.voice = match;

    // Animate sprite while talking
    const sprite = document.querySelector(`.char-sprite[data-char="${charKey}"]`);
    if (sprite) sprite.classList.add('talking');
    showBubble(charKey, text.substring(0, 60) + (text.length > 60 ? '...' : ''));

    utt.onend = () => {
        if (sprite) sprite.classList.remove('talking');
        const bubble = document.querySelector(`.speech-bubble[data-char="${charKey}"]`);
        if (bubble) bubble.classList.remove('visible');
        if (onDone) onDone();
    };
    window.speechSynthesis.speak(utt);
}

function showBubble(charKey, text) {
    const bubble = document.querySelector(`.speech-bubble[data-char="${charKey}"]`);
    if (!bubble) return;
    bubble.textContent = text;
    bubble.classList.add('visible');
    setTimeout(() => bubble.classList.remove('visible'), 4000);
}

// ═══════════════════════════════════════════
//  LOAD TOPIC — fetches from backend
// ═══════════════════════════════════════════
async function loadTopic(topic) {
    currentTopic = topic;
    // Update chip styles
    document.querySelectorAll('.topic-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.topic === topic);
    });
    await switchMode(currentMode);
}

// ═══════════════════════════════════════════
//  SWITCH MODE
// ═══════════════════════════════════════════
async function switchMode(mode) {
    currentMode = mode;
    gameActive = false;
    if (gameLoop) { cancelAnimationFrame(gameLoop); gameLoop = null; }
    if (window.speechSynthesis) window.speechSynthesis.cancel();

    // Tab UI
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    const tab = document.getElementById(`tab-${mode}`);
    if (tab) tab.classList.add('active');

    // Show loader
    const arena = document.getElementById('content-arena');
    arena.innerHTML = '<div class="loader"><i class="fas fa-spinner fa-spin"></i><p>Loading...</p></div>';

    try {
        const res = await fetch(`/api/lesson_content?subject={{ subject }}&topic=${encodeURIComponent(currentTopic)}&mode=${mode}`);
        lessonData = await res.json();

        // Apply character theme color
        const col = lessonData.character.color || '#f97316';
        document.documentElement.style.setProperty('--char-color', col);
        document.documentElement.style.setProperty('--glow', col + '66');
        activeCharKey = lessonData.character.image.replace('.png', '');

        // Build character stage
        buildCharStage(lessonData.character);

        // Render mode
        arena.innerHTML = '';
        arena.classList.remove('slide-in');
        void arena.offsetWidth;
        arena.classList.add('slide-in');

        if (mode === 'storybook') renderStorybook();
        else if (mode === 'adventure') renderAdventure();
        else if (mode === 'puzzle') renderPuzzle();
        else if (mode === 'experiment') renderExperiment();
        else if (mode === 'voice') renderVoice();
        else if (mode === '3d-world') renderThreeWorld();

    } catch(e) {
        console.error(e);
        arena.innerHTML = '<p style="color:#f87171; text-align:center; padding:3rem;">Failed to load — check your connection!</p>';
    }
}

// ═══════════════════════════════════════════
//  BUILD CHARACTER STAGE
// ═══════════════════════════════════════════
function buildCharStage(char) {
    const stage = document.getElementById('char-stage');
    const key = char.image.replace('.png', '');
    // Only rebuild if character changed
    if (stage.querySelector(`[data-char="${key}"]`)) return;

    const delay = 0;
    const card = document.createElement('div');
    card.className = 'char-card';
    card.style.animationDelay = `${delay}s`;
    card.innerHTML = `
        <div class="speech-bubble" data-char="${key}"></div>
        <div class="char-sprite active-char" data-char="${key}"
             style="background-image:url('/static/anime/${char.image}');"
             onclick="charSpeak('${key}', '${char.catchphrase.replace(/'/g, "\\'")}')">
        </div>
        <div class="char-name-badge">${char.name}</div>

function startGame() {
    const canvas = document.getElementById('gameCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = Math.min(800, canvas.parentElement.clientWidth - 40);
    gameActive = true; score = 0; gameItems = [];
    player.x = 60; player.y = canvas.height - 80;

    const gd = lessonData.adventure?.game_data || {};
    const label = gd.target || gd.word || currentTopic.split(' ')[0];
    for (let i=0; i<TARGET_SCORE; i++) {
        gameItems.push({
            x: 80 + Math.random()*(canvas.width-120),
            y: 40 + Math.random()*(canvas.height-100),
            collected: false, label: label
        });
    }

    function loop() {
        if (!gameActive) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw grid bg
        ctx.fillStyle = '#0d1b2a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(255,255,255,0.04)';
        for (let x=0; x<canvas.width; x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
        for (let y=0; y<canvas.height; y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

        // Move player
        const s = player.speed;
        if (keys['ArrowUp']    || keys['w']) player.y = Math.max(0, player.y - s);
        if (keys['ArrowDown']  || keys['s']) player.y = Math.min(canvas.height - player.h, player.y + s);
        if (keys['ArrowLeft']  || keys['a']) player.x = Math.max(0, player.x - s);
        if (keys['ArrowRight'] || keys['d']) player.x = Math.min(canvas.width - player.w, player.x + s);

        // Draw player as glowing box with char color
        const col = getComputedStyle(document.documentElement).getPropertyValue('--char-color').trim() || '#f97316';
        ctx.shadowColor = col; ctx.shadowBlur = 20;
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.roundRect(player.x, player.y, player.w, player.h, 10);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw stars
        gameItems.forEach(item => {
            if (item.collected) return;
            // glow
            ctx.shadowColor = '#facc15'; ctx.shadowBlur = 15;
            ctx.font = '28px serif';
            ctx.fillText('🌟', item.x, item.y + 28);
            ctx.shadowBlur = 0;
            // collision
            if (player.x < item.x+30 && player.x+player.w > item.x &&
                player.y < item.y+30 && player.y+player.h > item.y) {
                item.collected = true;
                score++;
                document.getElementById('score-hud').textContent = `Crystals: ${score}/${TARGET_SCORE}`;
                // Victory sound
                playBeep(800 + score*100, 0.2);
                if (score >= TARGET_SCORE) {
                    gameActive = false;
                    ctx.fillStyle = 'rgba(0,0,0,0.6)';
                    ctx.fillRect(0,0,canvas.width,canvas.height);
                    ctx.font = 'bold 3rem Bangers';
                    ctx.fillStyle = '#facc15';
                    ctx.textAlign = 'center';
                    ctx.fillText('MISSION COMPLETE!', canvas.width/2, canvas.height/2);
                    ctx.textAlign = 'left';
                    speakAs("Amazing! Mission Complete! You collected all the crystals!", activeCharKey);
                    awardXP(60);
                    return;
                }
            }
        });

        ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '14px Nunito';
        ctx.fillText(`Topic: ${currentTopic}`, 10, 20);
        gameLoop = requestAnimationFrame(loop);
    }
    gameLoop = requestAnimationFrame(loop);
}

function renderPuzzle() {

        </div>
        <div class="puzzle-items-row" id="puzzle-items"></div>

            <i class="fas fa-forward"></i> Next Puzzle
        </button>
    `;
    const cont = document.getElementById('puzzle-items');
    // Shuffle items
    const shuffled = [...items].sort(() => Math.random() - 0.5);
    shuffled.forEach(item => {
        const chip = document.createElement('div');
        chip.className = 'drag-chip'; chip.draggable = true; chip.textContent = item;
        chip.addEventListener('dragstart', e => { e.dataTransfer.setData('text', item); chip.style.opacity='0.4'; });
        chip.addEventListener('dragend', () => { chip.style.opacity='1'; });
        // Touch drag
        chip.addEventListener('touchstart', () => { chip._touchVal = item; }, {passive:true});
        cont.appendChild(chip);
    });
    const zone = document.getElementById('drop-zone');
    zone.ondragover = e => { e.preventDefault(); zone.classList.add('drag-over'); };
    zone.ondragleave = () => zone.classList.remove('drag-over');
    zone.ondrop = e => {
        e.preventDefault();
        zone.classList.remove('drag-over');
        const val = e.dataTransfer.getData('text');
        checkAnswer(val, answer, zone);
    };
    // Touch drop fallback
    zone.addEventListener('touchend', e => {

    });
}

function checkAnswer(val, answer, zone) {
    const msg = document.getElementById('puzzle-msg');
    const correct = val.toString().trim().toLowerCase() === answer.toString().trim().toLowerCase();
    zone.textContent = val;
    if (correct) {
        zone.classList.add('success');
        msg.innerHTML = '✅ <span style="color:#4ade80">CORRECT! Brilliant! 🎉</span>';
        speakAs(`Yes! ${val} is correct! You are a genius!`, activeCharKey);
        playBeep(880, 0.15); setTimeout(() => playBeep(1100, 0.15), 180); setTimeout(() => playBeep(1400, 0.2), 360);
        document.getElementById('next-puzzle-btn').style.display = 'inline-flex';
        setTimeout(() => awardXP(40), 1200);
    } else {
        zone.classList.remove('success'); zone.style.borderColor = '#f87171';
        msg.innerHTML = `❌ <span style="color:#f87171">Not quite! The answer was <strong>${answer}</strong>. Try again!</span>`;
        speakAs(`Hmm, not quite! The answer was ${answer}. Keep trying!`, activeCharKey);
        playBeep(220, 0.3);
        setTimeout(() => { zone.textContent = '🎯 Drop Here'; zone.style.borderColor = ''; }, 2000);
    }
}

function runExperiment() {
    const canvas = document.getElementById('experimentCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const expType = lessonData.experiment?.type || 'chemical_reaction';
    const steps = lessonData.experiment?.steps || [];
    const col = getComputedStyle(document.documentElement).getPropertyValue('--char-color').trim() || '#f97316';
    let t = 0, stepIdx = 0;
    const stepsDiv = document.getElementById('exp-steps');
    if (stepsDiv) { stepsDiv.innerHTML = steps.map((s,i)=>`<div id="step-${i}" style="padding:0.4rem 0.8rem;border-radius:8px;opacity:0.4;transition:0.4s;">${i+1}. ${s}</div>`).join(''); }

    const anim = setInterval(() => {
        t++;
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = '#071428'; ctx.fillRect(0,0,W,H);

        if (expType === 'water_cycle') {
            // Ocean
            ctx.fillStyle = '#1e40af'; ctx.fillRect(0, H*0.7, W, H*0.3);
            // Sun
            ctx.beginPath(); ctx.arc(60,60,30,0,Math.PI*2); ctx.fillStyle='#fbbf24'; ctx.fill();
            // Evaporation droplets rising
            for(let i=0;i<8;i++) { const dy=(t*2+i*30)%160; ctx.beginPath(); ctx.arc(80+i*40, H*0.7-dy, 5,0,Math.PI*2); ctx.fillStyle=`rgba(147,197,253,${0.8-dy/160})`; ctx.fill(); }
            // Cloud
            if(t>30){ ctx.beginPath(); ctx.arc(220,80,35,0,Math.PI*2); ctx.arc(260,65,40,0,Math.PI*2); ctx.arc(300,80,30,0,Math.PI*2); ctx.fillStyle='#e2e8f0'; ctx.fill(); }
            // Rain
            if(t>50){ for(let i=0;i<10;i++){ const ry=(t*4+i*20)%200; ctx.fillStyle='#93c5fd'; ctx.fillRect(200+i*12, 130+ry, 3, 12); } }
            ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='14px Nunito'; ctx.fillText('Water Cycle Simulation',W/2,H-10);
        } else if (expType === 'plant_growth') {
            // Soil
            ctx.fillStyle='#78350f'; ctx.fillRect(0,H*0.75,W,H*0.25);
            // Stem grows
            const stemH = Math.min(t*3, H*0.6);
            ctx.strokeStyle='#16a34a'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(W/2,H*0.75); ctx.lineTo(W/2,H*0.75-stemH); ctx.stroke();
            // Leaves
            if(stemH>60){ ctx.fillStyle='#22c55e'; ctx.beginPath(); ctx.ellipse(W/2-30,H*0.75-stemH*0.5,25,14,Math.PI/4,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(W/2+30,H*0.75-stemH*0.6,25,14,-Math.PI/4,0,Math.PI*2); ctx.fill(); }
            // Flower
            if(t>60){ ctx.font='50px serif'; ctx.textAlign='center'; ctx.fillText('🌸',W/2+2,H*0.75-stemH-20); }
            // Sun
            ctx.beginPath(); ctx.arc(W-70,70,40,0,Math.PI*2); ctx.fillStyle='#fbbf24'; ctx.fill();
            ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='14px Nunito'; ctx.fillText('Plant Growth',W/2,H-10);
        } else if (expType === 'magnetism') {
            // Two magnets
            const d = t > 40 ? Math.max(30,100-t) : 100;
            ctx.fillStyle='#ef4444'; ctx.fillRect(W/2-d-60,H/2-20,60,40); ctx.fillStyle='#fff'; ctx.font='bold 18px Nunito'; ctx.textAlign='center'; ctx.fillText('N',W/2-d-30,H/2+7);
            ctx.fillStyle='#3b82f6'; ctx.fillRect(W/2+d,H/2-20,60,40); ctx.fillStyle='#fff'; ctx.fillText('S',W/2+d+30,H/2+7);
            // Field lines
            for(let i=0;i<5;i++){ const fy=H/2-40+i*20; ctx.strokeStyle=`rgba(250,204,21,0.5)`; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(W/2-d,fy); ctx.bezierCurveTo(W/2-d+30,fy-20,W/2+d-30,fy-20,W/2+d,fy); ctx.stroke(); }
            ctx.fillStyle='#fff'; ctx.font='14px Nunito'; ctx.fillText('Magnetic Field Simulation',W/2,H-10);
        } else if (expType === 'light_shadow') {
            // Light source
            ctx.beginPath(); ctx.arc(60,H/2,25,0,Math.PI*2); ctx.fillStyle='#fbbf24'; ctx.shadowColor='#fbbf24'; ctx.shadowBlur=30; ctx.fill(); ctx.shadowBlur=0;
            // Object
            const objX = 220; ctx.fillStyle='#6366f1'; ctx.fillRect(objX,H/2-40,40,80);
            // Shadow
            const angle = (t%120)/120 * Math.PI * 0.8 - Math.PI*0.4;
            ctx.fillStyle='rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.moveTo(objX+40,H/2-40); ctx.moveTo(objX+40,H/2+40);
            const sLen = 150; ctx.lineTo(objX+40+Math.cos(angle)*sLen, H/2+Math.sin(angle)*sLen+80); ctx.lineTo(objX+40+Math.cos(angle)*sLen, H/2+Math.sin(angle)*sLen-80); ctx.closePath(); ctx.fill();
            ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='14px Nunito'; ctx.fillText('Light & Shadow',W/2,H-10);
        } else {
            // Generic chemical reaction
            // Flask A
            ctx.fillStyle='rgba(34,197,94,0.6)'; ctx.beginPath(); ctx.arc(W/3,H/2,50,0,Math.PI*2); ctx.fill();
            ctx.font='40px serif'; ctx.textAlign='center'; ctx.fillText('🧪',W/3,H/2+15);
            // Flask B
            ctx.fillStyle='rgba(239,68,68,0.6)'; ctx.beginPath(); ctx.arc(2*W/3,H/2,50,0,Math.PI*2); ctx.fill();
            ctx.fillText('⚗️',2*W/3,H/2+15);
            // Bubbles rising
            for(let i=0;i<15;i++){ const bx=W/2+(Math.sin(i*1.3)*80); const by=H/2-80-((t*3+i*20)%200); ctx.beginPath(); ctx.arc(bx,by,5+Math.sin(i)*3,0,Math.PI*2); ctx.fillStyle=`rgba(250,204,21,${0.8-(by/(H/2))*.5})`; ctx.fill(); }
            if(t>50){ ctx.fillStyle=col; ctx.font='bold 20px Nunito'; ctx.fillText('💥 Reaction Complete!',W/2,60); }
            ctx.fillStyle='#fff'; ctx.font='14px Nunito'; ctx.fillText('Chemical Reaction',W/2,H-10);
        }
        if(t%30===0 && stepIdx<steps.length){ const el=document.getElementById(`step-${stepIdx}`); if(el){el.style.opacity='1';el.style.background='rgba(249,115,22,0.2)';el.style.fontWeight='700';} stepIdx++; }
        if(t>=90){ clearInterval(anim); }
    }, 50);

    const obs = document.getElementById('exp-observation');
    if(obs) obs.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Running simulation...';
    setTimeout(() => {
        if(obs) obs.innerHTML = `✅ <strong>Result:</strong> ${lessonData.experiment?.instructions || 'Experiment complete!'}`;
        speakAs(`Wonderful! The ${currentTopic} experiment is complete! Did you see what happened?`, activeCharKey);
        playBeep(523,0.15); setTimeout(()=>playBeep(659,0.15),200); setTimeout(()=>playBeep(784,0.2),400);
        awardXP(45);
    }, 4500);
}

let recognition = null;
function startListening() {
    const orb = document.getElementById('mic-orb');
    const feedback = document.getElementById('voice-feedback');
    if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        feedback.className='feedback-msg wrong'; feedback.textContent = 'Speech recognition not supported in your browser.'; return;
    }
    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US'; recognition.interimResults = false;
    orb.classList.add('listening'); orb.textContent = '👂';
    feedback.textContent = 'Listening...'; feedback.className = 'feedback-msg';

    recognition.onresult = e => {
        const heard = e.results[0][0].transcript.toLowerCase().trim();
        const target = document.getElementById('target-sentence').textContent.toLowerCase();
        orb.classList.remove('listening'); orb.textContent = '🎙️';
        const targetWords = target.split(' ').slice(0,3);
        const match = targetWords.some(w => heard.includes(w.replace(/[^a-z]/g,'')));
        if (match) {
            feedback.className = 'feedback-msg correct';
            feedback.innerHTML = `✅ You said: "${heard}" — PERFECT! 🎉`;
            speakAs("Excellent pronunciation! You are amazing!", activeCharKey);
            playBeep(1000, 0.3); playBeep(1200, 0.3);
            awardXP(50);
        } else {
            feedback.className = 'feedback-msg wrong';
            feedback.innerHTML = `❌ You said: "${heard}" — Try again!`;
            speakAs("Almost there! Try one more time!", activeCharKey);
        }
    };
    recognition.onerror = e => { orb.classList.remove('listening'); orb.textContent = '🎙️'; feedback.textContent = `Error: ${e.error}`; };
    recognition.onend = () => { orb.classList.remove('listening'); orb.textContent = '🎙️'; };
    recognition.start();
    // Track attempts
    const atEl = document.getElementById('attempt-count');
    if (atEl) { const n = (parseInt(atEl.textContent.split(':')[1])||0)+1; atEl.textContent = `Attempts: ${n}`; }
}

// ═══════════════════════════════════════════
//  AUDIO HELPER (Web Audio API beep)
// ═══════════════════════════════════════════
function playBeep(freq, duration=0.2) {
    try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.3, ac.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
        osc.start(); osc.stop(ac.currentTime + duration);
    } catch(e) {}
}

// ═══════════════════════════════════════════
//  XP AWARD — with confetti + toast + achievement check
// ═══════════════════════════════════════════
async function awardXP(amt) {
    // Show GSAP popup
    const pop = document.getElementById('xp-popup');
    document.getElementById('xp-amount').textContent = amt;
    pop.style.display = 'block';
    gsap.fromTo(pop, { y: -30, opacity: 0, scale: 0.8 }, { y: 0, opacity: 1, scale: 1.1, duration: 0.5, ease: 'back.out' });
    setTimeout(() => gsap.to(pop, { opacity: 0, y: -40, duration: 0.5, onComplete: () => pop.style.display='none' }), 2500);

    // 🎊 Confetti burst from top-center
    launchConfettiLocal(window.innerWidth / 2, 80, 70);

    // 🔔 Toast notification
    showToastLocal(`+${amt} XP earned! Keep going! ⚡`, 'xp');

    // 📊 Update session XP tracker bar
    updateSessionXP(amt);

    try {
        const res = await fetch('/complete_topic', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic: currentTopic, mode: currentMode, xp: amt })
        });
        const data = await res.json();
        if (data.new_xp !== undefined) {
            const xpEl = document.getElementById('xp-display');
            if (xpEl) { xpEl.textContent = data.new_xp; }
        }
        // Check for newly unlocked achievements
        checkAchievementsLocal();
    } catch(e) {}
}

// ── Session XP Tracker ──────────────────────────────────────────────
let sessionXP = 0;
const SESSION_XP_GOAL = 100;
function updateSessionXP(amt) {
    sessionXP += amt;
    const pct = Math.min(100, (sessionXP / SESSION_XP_GOAL) * 100);
    const fill = document.getElementById('session-xp-fill');
    const val = document.getElementById('session-xp-val');
    if (fill) fill.style.width = pct + '%';
    if (val) val.textContent = '+' + sessionXP;
    // Level up celebration when goal hit
    if (sessionXP >= SESSION_XP_GOAL) {
        showToastLocal('🌟 Session Goal Reached! You\'re amazing!', 'achievement');
        launchConfettiLocal(window.innerWidth*0.25, window.innerHeight*0.2, 80);
        launchConfettiLocal(window.innerWidth*0.75, window.innerHeight*0.2, 80);
        sessionXP = 0;
        if (fill) fill.style.width = '0%';
    }
}

// ── Hint Button ──────────────────────────────────────────────────────
async function fetchHint() {
    const btn = document.getElementById('hint-btn');
    if (btn) { btn.textContent = '⏳'; btn.disabled = true; }
    try {
        const res = await fetch(`/api/hint?subject={{ subject }}&topic=${encodeURIComponent(currentTopic)}`);
        const data = await res.json();
        showToastLocal(`💡 Hint: ${data.hint}`, 'success');
    } catch(e) {
        showToastLocal('💡 You can do it! Take it step by step!', 'success');
    } finally {
        if (btn) { btn.textContent = '💡 Hint'; btn.disabled = false; }
    }
}


// ── Local Confetti (self-contained for this page) ──────────────────────
function launchConfettiLocal(x, y, count = 60) {
    const cols = ['#f97316','#a855f7','#06b6d4','#10b981','#fbbf24','#f43f5e','#fff'];
    for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;z-index:99999;pointer-events:none;left:${x}px;top:${y}px;
            width:${Math.random()*8+4}px;height:${Math.random()*8+4}px;
            background:${cols[Math.floor(Math.random()*cols.length)]};
            border-radius:${Math.random()>0.5?'50%':'2px'};`;
        document.body.appendChild(el);
        const angle = Math.random() * Math.PI * 2;
        let vx = Math.cos(angle)*(Math.random()*6+3);
        let vy = Math.sin(angle)*(Math.random()*6+3) - 4;
        let px = x, py = y, grav = 0.3, life = 1;
        (function tick() {
            px += vx; py += vy + grav; grav += 0.12; life -= 0.02;
            el.style.left = px+'px'; el.style.top = py+'px';
            el.style.opacity = life;
            if (life > 0) requestAnimationFrame(tick); else el.remove();
        })();
    }
}

// ── Local Toast ─────────────────────────────────────────────────────────
function showToastLocal(msg, type = 'xp') {
    let c = document.getElementById('li-toast-container');
    if (!c) {
        c = document.createElement('div');
        c.id = 'li-toast-container';
        c.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:100000;display:flex;flex-direction:column;align-items:flex-end;gap:8px;';
        document.body.appendChild(c);
    }
    const t = document.createElement('div');
    const colors = {xp:'rgba(249,115,22,0.95)', achievement:'rgba(168,85,247,0.95)', success:'rgba(16,185,129,0.95)'};
    const icons = {xp:'⚡', achievement:'🏆', success:'✅'};
    t.innerHTML = `<span style="font-size:1.2rem">${icons[type]||'✅'}</span><span>${msg}</span>`;
    t.style.cssText = `display:flex;align-items:center;gap:10px;padding:12px 18px;
        background:${colors[type]||colors.xp};backdrop-filter:blur(20px);border-radius:14px;
        color:#fff;font-weight:800;font-size:0.9rem;box-shadow:0 8px 32px rgba(0,0,0,0.4);
        transform:translateX(120%);transition:transform 0.4s cubic-bezier(0.34,1.56,0.64,1);max-width:280px;`;
    c.appendChild(t);
    requestAnimationFrame(() => t.style.transform = 'translateX(0)');
    setTimeout(() => { t.style.transform='translateX(120%)'; setTimeout(()=>t.remove(), 400); }, 3000);
}

// ── Achievement unlock checker ───────────────────────────────────────────
async function checkAchievementsLocal() {
    try {
        const resp = await fetch('/api/achievements');
        const list = await resp.json();
        const earned = list.filter(a => a.earned);
        const prev = JSON.parse(localStorage.getItem('eg_achieved') || '[]');
        let newUnlocks = [];
        earned.forEach(a => { if (!prev.includes(a.id)) newUnlocks.push(a); });
        if (newUnlocks.length > 0) {
            localStorage.setItem('eg_achieved', JSON.stringify(earned.map(a=>a.id)));
            newUnlocks.forEach((a, i) => {
                setTimeout(() => {
                    showToastLocal(`🏆 Achievement Unlocked: ${a.icon} ${a.name}!`, 'achievement');
                    launchConfettiLocal(window.innerWidth*0.3, window.innerHeight*0.3, 60);
                    launchConfettiLocal(window.innerWidth*0.7, window.innerHeight*0.3, 60);
                }, i * 1200);
            });
        } else {
            localStorage.setItem('eg_achieved', JSON.stringify(earned.map(a=>a.id)));
        }
    } catch(e) {}
}

// ═══════════════════════════════════════════
//  3D LEARNING ISLAND (Three.js)
// ═══════════════════════════════════════════
function renderThreeWorld() {
    const arena = document.getElementById('content-arena');
    arena.innerHTML = `
        <div style="text-align:center;margin-bottom:1rem;">
            <h2 style="font-family:'Bangers',cursive;font-size:2rem;color:var(--char-color);">🌍 3D Learning Island</h2>
            <p style="opacity:0.7;">Explore the knowledge island! Drag to rotate, scroll to zoom.</p>
        </div>
        <div id="three-mount" style="width:100%;height:420px;border-radius:20px;overflow:hidden;border:2px solid var(--char-color);box-shadow:0 0 40px var(--glow);"></div>
        <div style="display:flex;gap:1rem;justify-content:center;margin-top:1rem;flex-wrap:wrap;" id="island-facts"></div>
    `;
    if (typeof THREE === 'undefined') { arena.innerHTML += '<p style="color:#f87171;text-align:center;margin-top:1rem;">Three.js loading...</p>'; return; }

    const mount = document.getElementById('three-mount');
    const W = mount.clientWidth, H = 420;
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(W, H); renderer.shadowMap.enabled = true;
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a2e);
    scene.fog = new THREE.Fog(0x0a0a2e, 80, 200);

    const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 500);
    camera.position.set(0, 30, 60);
    camera.lookAt(0, 0, 0);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.4); scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffd700, 1.2); sun.position.set(40, 60, 30); sun.castShadow = true; scene.add(sun);

    // Island
    const islandGeo = new THREE.CylinderGeometry(20, 22, 4, 32);
    const islandMat = new THREE.MeshPhongMaterial({ color: 0x16a34a });
    const island = new THREE.Mesh(islandGeo, islandMat); island.receiveShadow = true;
    scene.add(island);

    // Sand ring
    const sandGeo = new THREE.CylinderGeometry(22, 24, 3, 32);
    const sandMat = new THREE.MeshPhongMaterial({ color: 0xd4a017 });
    const sand = new THREE.Mesh(sandGeo, sandMat); sand.position.y = -0.5; scene.add(sand);

    // Water plane
    const waterGeo = new THREE.PlaneGeometry(300, 300, 10, 10);
    const waterMat = new THREE.MeshPhongMaterial({ color: 0x1e40af, transparent: true, opacity: 0.7, shininess: 100 });
    const water = new THREE.Mesh(waterGeo, waterMat); water.rotation.x = -Math.PI/2; water.position.y = -4; scene.add(water);

    // Knowledge orbs floating around the island (topic words)
    const topics = currentTopic.split(' ').concat(['XP', 'Fun', 'Learn']);
    const orbs = [];
    topics.forEach((t, i) => {
        const geo = new THREE.SphereGeometry(2.5, 16, 16);
        const mat = new THREE.MeshPhongMaterial({ color: new THREE.Color().setHSL(i/topics.length, 1, 0.6), emissive: new THREE.Color().setHSL(i/topics.length, 1, 0.2) });
        const orb = new THREE.Mesh(geo, mat);
        const angle = (i / topics.length) * Math.PI * 2;
        orb.position.set(Math.cos(angle)*28, 8 + Math.sin(i)*3, Math.sin(angle)*28);
        orb.castShadow = true;
        scene.add(orb); orbs.push({ mesh: orb, angle, speed: 0.005 + i*0.001 });
    });

    // Trees on island
    for(let i=0;i<5;i++) {
        const treeAngle = i/5*Math.PI*2;
        const trunkGeo = new THREE.CylinderGeometry(0.5,0.7,6,8);
        const trunk = new THREE.Mesh(trunkGeo, new THREE.MeshPhongMaterial({color:0x78350f}));
        trunk.position.set(Math.cos(treeAngle)*12, 5, Math.sin(treeAngle)*12); scene.add(trunk);
        const leafGeo = new THREE.ConeGeometry(4, 7, 8);
        const leaf = new THREE.Mesh(leafGeo, new THREE.MeshPhongMaterial({color:0x16a34a}));
        leaf.position.set(Math.cos(treeAngle)*12, 12, Math.sin(treeAngle)*12); scene.add(leaf);
    }

    // Stars in sky
    const starGeo = new THREE.BufferGeometry();
    const starVerts = [];
    for(let i=0;i<500;i++) { starVerts.push((Math.random()-0.5)*400,(Math.random())*200-20,(Math.random()-0.5)*400); }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts,3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({color:0xffffff,size:0.5})));

    // Mouse orbit
    let isDragging=false, prevMouse={x:0,y:0}, theta=0, phi=0.4;
    mount.addEventListener('mousedown', e=>{isDragging=true; prevMouse={x:e.clientX,y:e.clientY};});
    window.addEventListener('mouseup',()=>isDragging=false);
    window.addEventListener('mousemove',e=>{
        if(!isDragging)return;
        theta -= (e.clientX-prevMouse.x)*0.005;
        phi = Math.max(0.1,Math.min(1.2,phi-(e.clientY-prevMouse.y)*0.005));
        prevMouse={x:e.clientX,y:e.clientY};
    });
    mount.addEventListener('wheel', e=>{ camera.position.multiplyScalar(1+e.deltaY*0.001); }, {passive:true});

    let threeActive = true;
    const cleanUp = () => { threeActive=false; renderer.dispose(); };
    document.querySelectorAll('.mode-tab').forEach(t=>t.addEventListener('click',cleanUp,{once:true}));

    // Show island topic facts
    const factsDiv = document.getElementById('island-facts');
    if(factsDiv) {
        topics.slice(0,4).forEach(t=>{
            const pill = document.createElement('div');
            pill.style.cssText='padding:0.5rem 1.2rem;background:rgba(255,255,255,0.1);border-radius:50px;cursor:pointer;border:1px solid rgba(255,255,255,0.2);font-weight:700;';
            pill.textContent = '📚 '+t;
            pill.onclick = () => speakAs(`Explore ${t} on the learning island!`, activeCharKey);
            factsDiv.appendChild(pill);
        });
    }

    function threeLoop() {
        if(!threeActive) return;
        const R = 60;
        camera.position.x = R * Math.sin(theta) * Math.cos(phi);
        camera.position.y = R * Math.sin(phi) + 10;
        camera.position.z = R * Math.cos(theta) * Math.cos(phi);
        camera.lookAt(0,5,0);
        // Animate orbs
        orbs.forEach(o=>{ o.angle+=o.speed; o.mesh.position.x=Math.cos(o.angle)*28; o.mesh.position.z=Math.sin(o.angle)*28; o.mesh.position.y=8+Math.sin(o.angle*2)*3; o.mesh.rotation.y+=0.02; });
        // Water wave
        water.position.y = -4 + Math.sin(Date.now()*0.001)*0.5;
        renderer.render(scene, camera);
        requestAnimationFrame(threeLoop);
    }
    threeLoop();
    speakAs(`Welcome to the 3D Learning Island! Explore and discover ${currentTopic}!`, activeCharKey);
    awardXP(20);
}

    if (window.speechSynthesis) {
        window.speechSynthesis.onvoiceschanged = () => {};
        window.speechSynthesis.getVoices();
    }
    loadTopic(currentTopic);
});
</script>
